[project]
name = "cross-sums-bot"
version = "0.2.0"
description = "A backtracking solver and macOS screen automation for Offline Games Cross Sums"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pillow>=11.3"]

[project.scripts]
cross-sums = "cross_sums.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cross_sums"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
